# 버전 태그(v0.17.3 등)를 올리면 InkUI 폴더를 zip으로 묶어 GitHub 릴리스에 붙인다. (포에버용)
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          VER="${GITHUB_REF_NAME}"
          FILE="FOA_UI_Forever-${VER}.zip"
          zip -rq "$FILE" InkUI -x "*.DS_Store" "*.bak"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: FOA UI (Forever) ${{ github.ref_name }}
          files: ${{ env.FILE }}
