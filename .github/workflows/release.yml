# FOA_UI/FOA_UI.toc 의 "## Version" 이 바뀐 채로 main 에 올라오면
# 그 버전으로 태그와 릴리스(zip)를 GitHub 이 직접 만든다. 이미 있는 버전이면 건너뛴다.
# (Actions 탭에서 수동 실행도 가능)
name: release

on:
  push:
    branches: [main]
    paths: ["FOA_UI/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

# 연달아 올리면 마지막 것 하나만 릴리스한다 (WowUp 에서 "받았는데 또 업데이트" 방지)
#  새 push 가 오면 기다리던 이전 실행은 취소 · push 후 15분 동안 조용하면 그때 릴리스
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for a quiet period
        if: github.event_name == 'push'
        run: sleep 900

      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 '^## Version:' FOA_UI/FOA_UI.toc | sed 's/## Version: *//' | tr -d ' \r')
          TAG="v$VER"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TAG 릴리스가 이미 있어서 건너뜀"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.ver.outputs.skip == 'false'
        run: |
          # WowUp Hub 이 포에버용으로 알아보게: 인터페이스 16001 만 + 포에버 TOC(_Forever) + release.json(flavor forever)
          FILE="FOA_UI-forever-${TAG}.zip"
          rm -rf build && mkdir build && cp -r FOA_UI build/
          sed -i 's/^## Interface:.*/## Interface: 16001/' build/FOA_UI/FOA_UI.toc
          cp build/FOA_UI/FOA_UI.toc build/FOA_UI/FOA_UI_Forever.toc
          (cd build && zip -rq "../$FILE" FOA_UI -x "*.DS_Store" "*.bak")
          cat > release.json <<EOF2
          {"releases":[{"name":"FOA UI (Forever)","version":"${TAG}","filename":"${FILE}","nolib":false,"metadata":[{"flavor":"forever","interface":16001}]}]}
          EOF2
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Publish release
        if: steps.ver.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: FOA UI (Forever) ${{ env.TAG }}
          files: |
            ${{ env.FILE }}
            release.json
